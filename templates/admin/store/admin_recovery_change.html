{% extends "admin/base_site.html" %}

{% block title %}Set new admin credentials{% endblock %}

{% block content %}
<div id="content-main">
    <h1>Set new admin credentials</h1>
    <p>Your email code is verified. Choose a new username and password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="submit-row">
            <input type="submit" value="Save username and password" class="default">
        </div>
    </form>
</div>
{% endblock %}
