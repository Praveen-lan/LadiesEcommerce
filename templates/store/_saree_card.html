<div class="saree-card">
    <a href="{% if saree.slug %}{% url 'store:saree_detail' saree.slug %}{% else %}{% url 'store:catalog' %}{% endif %}" class="saree-img-wrap">
        <img src="{{ saree.image_source }}" alt="{{ saree.name }}" loading="lazy">
        {% if saree.product_id %}<span class="saree-product-id">Product ID: {{ saree.product_id }}</span>{% endif %}
        <div class="card-actions">
            <span class="wishlist" title="Add to wishlist"><i class="bi bi-heart"></i></span>
            <span class="quick-view" title="View details"><i class="bi bi-eye"></i></span>
        </div>
    </a>
    <div class="saree-body">
        <a href="{% if saree.slug %}{% url 'store:saree_detail' saree.slug %}{% else %}{% url 'store:catalog' %}{% endif %}" class="saree-name-link"><h3 class="saree-name">{{ saree.name }}</h3></a>
        <div class="saree-price">
            <strong>&#8377; {{ saree.final_amount }}</strong>
            {% if saree.discount_amount %}<del>&#8377; {{ saree.original_amount }}</del>{% endif %}
        </div>
        <form action="{% url 'store:add_to_cart' %}" method="post" class="saree-card-add-form">
            {% csrf_token %}
            <input type="hidden" name="saree_id" value="{{ saree.id }}">
            <input type="hidden" name="quantity" value="1">
            <input type="hidden" name="redirect" value="{{ request.get_full_path }}">
            <button type="submit" class="btn btn-buy w-100" {% if not saree.in_stock %}disabled{% endif %}>
                {% if saree.in_stock %}<i class="bi bi-bag-plus"></i> Add to Cart{% else %}Out of Stock{% endif %}
            </button>
        </form>
    </div>
</div>
