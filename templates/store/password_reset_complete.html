{% extends 'base.html' %}

{% block title %}Password reset complete | {{ site.shop_name|default:"Saree Elegance" }}{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container">
        <div class="auth-card">
            <h1 class="auth-card-title"><i class="bi bi-check-circle me-2"></i>Password reset complete</h1>
            <p class="auth-card-sub">Your password has been changed. You can now sign in with your new password.</p>
            <p class="auth-card-foot"><a href="{% url 'admin:login' %}">Go to admin login</a></p>
        </div>
    </div>
</section>
{% endblock %}
