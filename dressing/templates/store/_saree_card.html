<div class="saree-card">
    <a href="{% url 'store:saree_detail' saree.slug %}" class="saree-img-wrap">
        <img src="{{ saree.image_source }}" alt="{{ saree.name }}" loading="lazy">
        {% if saree.discount_percent %}
        <span class="discount-badge">-{{ saree.discount_percent }}%</span>
        {% endif %}
        <div class="card-actions">
            <span class="wishlist" title="Add to wishlist"><i class="bi bi-heart"></i></span>
            <span class="quick-view" title="View details"><i class="bi bi-eye"></i></span>
        </div>
    </a>
    <div class="saree-body">
        <span class="saree-fabric">{{ saree.fabric|default:saree.category.title }}</span>
        <a href="{% url 'store:saree_detail' saree.slug %}" class="saree-name-link"><h3 class="saree-name">{{ saree.name }}</h3></a>
        <div class="saree-price">
            <strong>&#8377; {{ saree.price }}</strong>
            {% if saree.mrp %}<del>&#8377; {{ saree.mrp }}</del>{% endif %}
        </div>
        <form action="{% url 'store:add_to_cart' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="saree_id" value="{{ saree.id }}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn btn-buy w-100"><i class="bi bi-bag-plus"></i> Add to Cart</button>
        </form>
    </div>
</div>
